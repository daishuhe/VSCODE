<script>
"use strict";
// ---------- 俄罗斯方块 ----------
const COLS = 10, ROWS = 20, EMPTY = 0;

// 方块定义 [形状矩阵, 颜色]
const SHAPES = [
  { m: [[1,1,1,1]],                c: '#26c6da' }, // I 青
  { m: [[1,1],[1,1]],              c: '#ffd54f' }, // O 黄
  { m: [[0,1,0],[1,1,1]],          c: '#ab47bc' }, // T 紫
  { m: [[1,0,0],[1,1,1]],          c: '#ff8a65' }, // L 橙
  { m: [[0,0,1],[1,1,1]],          c: '#5c6bc0' }, // J 蓝
  { m: [[0,1,1],[1,1,0]],          c: '#66bb6a' }, // S 绿
  { m: [[1,1,0],[0,1,1]],          c: '#ef5350' }, // Z 红
];

const boardEl = document.getElementById('board');
const nextEl  = document.getElementById('next');
const holdEl  = document.getElementById('hold');

// 构建 20x10 网格
const cells = [];
for (let r = 0; r < ROWS; r++) {
  cells.push([]);
  for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div');
    boardEl.appendChild(d);
    cells[r].push(d);
  }
}

// ---------- 状态 ----------
let board = [];          // ROWS x COLS, 存颜色字符串
let current = null;      // {m, c, r, cPos, type}
let queue = [];
let holdType = null;
let canHold = true;
let score = 0, linesCleared = 0, level = 1;
let best = +(localStorage.getItem('tetris_best') || 0);
let gameOver = false, paused = false, running = false;
let dropTimer = null;
let moneyLock = false;      // 没钱断供 → 游戏冻结
let spentThisGame = 0;      // 本局氪金统计

const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const levelEl = document.getElementById('level');
const linesEl = document.getElementById('lines');
bestEl.textContent = best;

// ---------- 虚拟钱包 / 富豪会员 / 商店数据 ----------
let coins = +(localStorage.getItem('tetris_rich_coins') || 0);   // 富豪版：开局 0 金币！不充钱玩不了
let vip = localStorage.getItem('tetris_rich_vip') === '1';       // 充过钱 = 富豪会员（8 折）
const SHAPE_NAMES = ['长条 I', '方块 O', 'T 形', 'L 形', 'J 形', 'S 形', 'Z 形'];
const PRICES = [8, 5, 6, 4, 4, 3, 3];                            // 每块明码标价，不同块不同价
const PACKS = [
  { pay: '¥1',  coin: 100,   note: '穷鬼救济包（约 20 块）',  tip: '勉强够入场被羞辱 😂' },
  { pay: '¥6',  coin: 680,   note: '会员套餐，全场 8 折',      tip: '👑 首充解锁 永久富豪会员', hot: true },
  { pay: '¥30', coin: 3800,  note: '额外赠送 200 金币',        tip: '👑 中产豪横包' },
  { pay: '¥98', coin: 13800, note: '额外赠送 1000 金币',       tip: '👑 真·富豪，随便造' },
];
const POOR_LINES = [
  '🖕 穷鬼！连块都买不起，先去搬砖！',
  '👛 余额不足，你的穷酸已经藏不住了～',
  '😂 买不起就别硬撑，连 ¥6 首充都舍不得？',
  '🪙 金币不够？建议把手机也卖了。',
  '💸 就这？穷鬼的挣扎真是令人感动。',
];
const ENTER_TAUNTS = [
  '🖕 穷鬼想白嫖？一块方块都不买也配入场？',
  '🎫 没买块还想玩？富人的游戏不欢迎白嫖党！',
  '😏 连最便宜的 S 块都舍不得买？玩什么富豪方块！',
];
function taunt(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function priceOf(t) { return vip ? Math.ceil(PRICES[t] * 0.8) : PRICES[t]; } // 会员 8 折
function saveWallet() {
  localStorage.setItem('tetris_rich_coins', coins);
  localStorage.setItem('tetris_rich_vip', vip ? '1' : '0');
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function updateWallet() {
  document.getElementById('wallet').textContent = coins > 0 ? coins + ' 🪙' : '0 🪙（穷鬼）';
  document.getElementById('wallet-in-modal').textContent = coins;
  document.getElementById('vip-badge').style.display = vip ? 'inline-block' : 'none';
  document.getElementById('vip-in-modal').textContent = vip ? '👑 富豪会员 · 全场 8 折' : '👤 未消费（穷鬼）';
}

// ---------- 工具 ----------
function emptyBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
}
function spawnType(t) {
  const s = SHAPES[t];
  const m = s.m.map(row => row.slice());
  return { m, c: s.c, type: t, r: 0, cPos: Math.floor((COLS - m[0].length) / 2) };
}
function collide(p, board) {
  for (let r = 0; r < p.m.length; r++)
    for (let c = 0; c < p.m[r].length; c++) {
      if (!p.m[r][c]) continue;
      const x = p.cPos + c, y = p.r + r;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
  return false;
}
function rotateM(m) {
  const n = m.length, w = m[0].length;
  const out = Array.from({ length: w }, () => Array(n).fill(0));
  for (let r = 0; r < n; r++)
    for (let c = 0; c < w; c++)
      out[c][n - 1 - r] = m[r][c];
  return out;
}
// 尝试旋转 + 简单墙踢
function tryRotate(dir) {
  const rotated = rotateM(current.m);
  const kicks = dir > 0 ? [0, -1, 1, -2, 2] : [0, 1, -1, 2, -2];
  for (const k of kicks) {
    const test = { ...current, m: rotated, cPos: current.cPos + k };
    if (!collide(test, board)) { current = test; return true; }
  }
  return false;
}
// 落点 y（幽灵用）
function dropY() {
  let y = current.r;
  while (!collide({ ...current, r: y + 1 }, board)) y++;
  return y;
}

// ---------- 渲染 ----------
function render() {
  // 背景（已锁定方块）
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      const d = cells[r][c];
      d.style.background = board[r][c] || 'rgba(255,255,255,0.03)';
      d.className = '';
    }
  if (!current || gameOver) return;
  // 幽灵
  const gy = dropY();
  for (let r = 0; r < current.m.length; r++)
    for (let c = 0; c < current.m[r].length; c++) {
      if (!current.m[r][c]) continue;
      const x = current.cPos + c, y = gy + r;
      if (y >= 0 && y < ROWS) {
        cells[y][x].style.background = current.c;
        cells[y][x].className = 'cell ghost';
      }
    }
  // 实体
  for (let r = 0; r < current.m.length; r++)
    for (let c = 0; c < current.m[r].length; c++) {
      if (!current.m[r][c]) continue;
      const x = current.cPos + c, y = current.r + r;
      if (y >= 0 && y < ROWS) {
        cells[y][x].style.background = current.c;
        cells[y][x].className = 'cell';
      }
    }
}
function drawMini(el, t) {
  const s = SHAPES[t];
  const m = s.m;
  el.innerHTML = '';
  for (let r = 0; r < 4; r++)
    for (let c = 0; c < 4; c++) {
      const d = document.createElement('div');
      const inShape = m[r] && m[r][c];
      d.style.background = inShape ? s.c : '';
      el.appendChild(d);
    }
}
function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  linesEl.textContent = linesCleared;
  if (queue.length) drawMini(nextEl, queue[0]); else nextEl.innerHTML = '';
  if (holdType === null) holdEl.innerHTML = '';
  else drawMini(holdEl, holdType);
}

// ---------- 游戏流程 ----------
function lock() {
  for (let r = 0; r < current.m.length; r++)
    for (let c = 0; c < current.m[r].length; c++)
      if (current.m[r][c]) {
        const y = current.r + r, x = current.cPos + c;
        if (y < 0) { endGame(); return; } // 锁在顶外 → 结束
        board[y][x] = current.c;
      }
  clearLines();
  canHold = true;
  spawnNext();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(v => v)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(EMPTY));
      cleared++;
      r++; // 重新检查同一行
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts;
    linesCleared += cleared;
    level = Math.floor(linesCleared / 10) + 1;
    if (score > best) { best = score; localStorage.setItem('tetris_best', best); }
    bestEl.textContent = best;
  }
}

function spawnNext() {
  if (queue.length === 0) { enterMoneyLock(); return; }  // 没买块 → 断供冻结
  current = spawnType(queue.shift());
  if (collide(current, board)) { endGame(); return; }
  render();
  updateHUD();
}
// 没钱断供 → 游戏冻结，请去充钱/买块续命
function enterMoneyLock() {
  if (!running || gameOver) return;
  moneyLock = true;
  current = null;
  render(); updateHUD();
  document.getElementById('broke-modal').classList.add('show');
  toast('💸 断粮了！想继续当富豪？快去充钱买方块！');
}
function hideBroke() { document.getElementById('broke-modal').classList.remove('show'); }
// 付款买块成功后被调用来复活
function reviveAfterBuy() {
  if (!running || gameOver || !moneyLock) return;
  moneyLock = false;
  hideBroke();
  closeShop();
  spawnNext();   // 刚买的块顶上
}
function endGame() {
  gameOver = true; running = false; moneyLock = false;
  clearInterval(dropTimer);
  hideBroke();
  const ov = document.getElementById('overlay');
  document.getElementById('final-score').textContent = '得分：' + score;
  document.getElementById('overlay-hint').innerHTML =
    '💸 本局氪金 <b style="color:#ffd54f">' + spentThisGame + ' 🪙</b>，得分 ' + score +
    (score >= best && score > 0 ? ' · 🎉 新纪录！' : '') +
    '<br>想再来一局？按 回车键，先滚去买方块！';
  ov.classList.add('show');
}

function speed() { return Math.max(80, 800 - (level - 1) * 70); }

function tick() {
  if (!running || paused || gameOver || moneyLock) return;
  if (!collide({ ...current, r: current.r + 1 }, board)) {
    current.r++;
    render();
  } else lock();
}

// ---------- 操作 ----------
function move(dx) {
  if (!running || paused || gameOver || moneyLock) return;
  const test = { ...current, cPos: current.cPos + dx };
  if (!collide(test, board)) { current = test; render(); }
}
function softDrop() {
  if (!running || paused || gameOver || moneyLock) return;
  if (!collide({ ...current, r: current.r + 1 }, board)) {
    current.r++; score += 1; updateHUD(); render();
  } else lock();
}
function hardDrop() {
  if (!running || paused || gameOver || moneyLock) return;
  const y = dropY();
  score += (y - current.r) * 2;
  current.r = y;
  updateHUD();
  lock();
}
function doHold() {
  if (!running || paused || gameOver || !canHold || moneyLock) return;
  if (holdType === null) {
    holdType = current.type;
    spawnNext();
  } else {
    const t = holdType;
    holdType = current.type;
    current = spawnType(t);
    if (collide(current, board)) { endGame(); return; }
  }
  canHold = false;
  render(); updateHUD();
}

// ---------- 控制 ----------
function startGame() {
  if (queue.length === 0) {   // 没买块还想入场？嘲讽你！
    toast(taunt(ENTER_TAUNTS));
    openShop(vip ? 'buy' : 'coin');
    return;
  }
  board = emptyBoard();
  score = 0; linesCleared = 0; level = 1; spentThisGame = 0;
  gameOver = false; paused = false; running = true; canHold = true;
  holdType = null; moneyLock = false;
  hideBroke();
  document.getElementById('overlay').classList.remove('show');
  clearInterval(dropTimer);
  dropTimer = setInterval(tick, speed());
  spawnNext();
  render(); updateHUD();
}
function togglePause() {
  if (!running || gameOver) return;
  paused = !paused;
  document.getElementById('overlay-hint').textContent = paused ? '已暂停，按 P 继续' : '按 回车键 开始游戏';
  document.getElementById('final-score').textContent = '';
  if (paused) document.getElementById('overlay').classList.add('show');
  else document.getElementById('overlay').classList.remove('show');
}

document.addEventListener('keydown', e => {
  const shop = document.getElementById('shop-modal');
  if (shop.classList.contains('show')) {   // 商店开着时，只响应 Esc
    if (e.key === 'Escape') closeShop();
    return;
  }
  if (e.key >= '1' && e.key <= '7') { buyShape(+e.key - 1); return; }  // 随时按数字键买单
  if (e.key === 'Enter') {
    if (!running || gameOver || paused) { startGame(); e.preventDefault(); }
    return;
  }
  if (!running || gameOver || moneyLock) return;
  switch (e.key) {
    case 'ArrowLeft':  case 'a': case 'A': move(-1); break;
    case 'ArrowRight': case 'd': case 'D': move(1);  break;
    case 'ArrowUp':    case 'w': case 'W': tryRotate(1); render(); break;
    case 'z': case 'Z': tryRotate(-1); render(); break;
    case 'ArrowDown':  case 's': case 'S': softDrop(); break;
    case ' ': hardDrop(); e.preventDefault(); break;
    case 'c': case 'C': doHold(); break;
    case 'p': case 'P': togglePause(); break;
  }
  if (['ArrowLeft','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
});

document.getElementById('start-btn').addEventListener('click', startGame);

// 移动端按钮
function mkBtn(txt, fn) {
  const b = document.createElement('button');
  b.textContent = txt;
  b.addEventListener('click', fn);
  return b;
}
const row = document.createElement('div');
row.className = 'btn-row';
row.append(
  mkBtn('⟲', () => { if (running && !paused) { tryRotate(-1); render(); } }),
  mkBtn('◀', () => move(-1)),
  mkBtn('▶', () => move(1)),
  mkBtn('▼', softDrop),
  mkBtn('⤓', hardDrop),
  mkBtn('C', doHold),
  mkBtn('⏸', togglePause),
  mkBtn('🛒 商店', () => openShop('buy')),
  mkBtn('💰 充值', () => openShop('coin')),
);
document.body.appendChild(row);

// ---------- 商店界面 ----------
function shapePrev(t) {
  const s = SHAPES[t];
  const wrap = document.createElement('div');
  wrap.className = 'shape-prev';
  wrap.style.gridTemplateColumns = 'repeat(' + s.m[0].length + ', 1fr)';
  for (let r = 0; r < s.m.length; r++)
    for (let c = 0; c < s.m[r].length; c++) {
      const d = document.createElement('div');
      if (s.m[r][c]) d.style.background = s.c;
      wrap.appendChild(d);
    }
  return wrap;
}
function buildBuyTab() {
  const el = document.getElementById('tab-buy');
  el.innerHTML = '';
  const tip = document.createElement('p');
  tip.style.cssText = 'font-size:12px;color:#9aa0d8;margin:0 0 10px;line-height:1.7';
  tip.textContent = '💸 全付费！每一块都得自己掏钱买，买完它就是你的下一块。键盘 1-7 快捷下单。';
  el.appendChild(tip);
  const grid = document.createElement('div');
  grid.className = 'shop-grid';
  SHAPES.forEach((s, t) => {
    const item = document.createElement('div');
    item.className = 'shop-item';
    const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = t + 1;
    item.appendChild(idx);
    item.appendChild(shapePrev(t));
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = SHAPE_NAMES[t];
    item.appendChild(nm);
    const pr = document.createElement('div'); pr.className = 'price';
    pr.innerHTML = (vip ? '<s>' + PRICES[t] + '</s>' : '') + priceOf(t) + ' 🪙';
    item.appendChild(pr);
    const btn = document.createElement('button');
    btn.className = 'buy-btn';
    btn.textContent = vip ? '设为下一块' : '🔒 穷鬼禁购 · 先充值';
    if (vip) btn.classList.add('gold');
    else btn.classList.add('locked');
    btn.addEventListener('click', () => buyShape(t));
    item.appendChild(btn);
    grid.appendChild(item);
  });
  el.appendChild(grid);
  if (!vip) {
    const lock = document.createElement('p');
    lock.className = 'note';
    lock.innerHTML = '🔒 未消费的<b style="color:#ffd54f">穷鬼</b>连一块方块都买不起。<br>充值任意金额 → 永久富豪会员 👑（见「充值」页）';
    el.appendChild(lock);
  }
}
function buildCoinTab() {
  const el = document.getElementById('tab-coin');
  el.innerHTML = '';
  const p = document.createElement('p');
  p.style.cssText = 'font-size:12px;color:#9aa0d8;margin:0 0 10px;text-align:left';
  p.textContent = '💳 穷鬼改造中心！本游戏全付费，先选套餐再充：';
  el.appendChild(p);
  PACKS.forEach(pk => {
    const row = document.createElement('div');
    row.className = 'pack' + (pk.hot ? ' hot' : '');
    const pay = document.createElement('div'); pay.className = 'pay'; pay.textContent = pk.pay;
    const info = document.createElement('div'); info.className = 'info';
    info.innerHTML = '到账 <b>' + pk.coin + ' 🪙</b><br>' + pk.note + '　·　' + pk.tip;
    const btn = document.createElement('button'); btn.className = 'packbtn'; btn.textContent = '立即充值';
    btn.addEventListener('click', () => payNow(pk, btn));
    row.append(pay, info, btn);
    el.appendChild(row);
  });
  const d = document.createElement('p');
  d.className = 'note';
  d.textContent = '⚠️ 虚拟充值演示，不会真实扣费。但“穷鬼”嘲讽是真的 😈';
  el.appendChild(d);
}
function buildVipTab() {
  const el = document.getElementById('tab-vip');
  el.innerHTML =
    '<div style="text-align:center;font-size:15px;font-weight:700;margin-bottom:6px;">' +
    (vip ? '👑 您已是 富豪会员' : '👤 普通玩家 · 穷鬼本鬼') + '</div>' +
    '<div class="vip-text">' +
    '<b>① 全付费制：</b>每一块方块都要自己掏钱买（会员 8 折）；<br>' +
    '<b>② 无免费午餐：</b>不再白送金币、没有消行返利；<br>' +
    '<b>③ 断供即冻结：</b>钱花光当场停摆，富豪身份作废；<br>' +
    '<b>④ 永久会员：</b>任意一次充值即永久 8 折；<br>' +
    '<b>⑤ 快捷操作：</b>游戏中按 1-7 直接扫码买块续命。</div>';
  if (!vip) {
    const b = document.createElement('button');
    b.style.cssText = 'margin-top:12px;background:linear-gradient(135deg,#ffd54f,#ff9f43);border:none;color:#3a2c00;font-weight:800;font-size:15px;padding:10px 26px;border-radius:30px;cursor:pointer';
    b.textContent = '💳 充值当富豪';
    b.addEventListener('click', () => openTab('coin'));
    el.appendChild(b);
  }
}
function openTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  ['buy', 'coin', 'vip'].forEach(n => { document.getElementById('tab-' + n).style.display = (n === name) ? '' : 'none'; });
}
function openShop(tab) {
  buildBuyTab(); buildCoinTab(); buildVipTab();
  openTab(tab);
  document.getElementById('shop-modal').classList.add('show');
  updateWallet();
}
function closeShop() { document.getElementById('shop-modal').classList.remove('show'); }

// 购买指定方块 → 付款后插入为下一块
function buyShape(t) {
  const need = priceOf(t);
  if (!vip) { toast('🔒 未消费的穷鬼禁止买方块！请先充值任意金额 👑（¥6 套餐最划算）'); return; }
  if (coins < need) { toast(taunt(POOR_LINES) + '（还差 ' + (need - coins) + ' 🪙，点 💰 充值）'); return; }
  coins -= need;
  if (running && !gameOver) spentThisGame += need;
  saveWallet(); updateWallet();
  queue.unshift(t);   // 插队：下一块就是它
  updateHUD();
  const tail =
    moneyLock ? '· 钱到货，游戏立即复活！' :
    (!running || gameOver) ? '· 已就绪 ' + queue.length + ' 块，按 回车键 入场！' :
    paused ? '· 已入队（暂停中，按 P 继续）' : '· 当前方块落地后就是它！';
  toast('💸 付款 ' + need + ' 🪙，喜提「' + SHAPE_NAMES[t] + '」，余额 ' + coins + ' 🪙 ' + tail);
  if (!running) closeShop();
  if (moneyLock && running && !gameOver) reviveAfterBuy();
}
// 虚拟充值（仅图一乐，不会真实扣费）
function payNow(pk, btn) {
  btn.textContent = '支付中…';
  btn.disabled = true;
  setTimeout(() => {
    const first = !vip;
    coins += pk.coin;
    vip = true;
    saveWallet(); updateWallet();
    buildBuyTab(); buildVipTab();
    if (moneyLock && running) openTab('buy');   // 断供中充值完 → 直接去选块复活
    btn.textContent = '✓ 已到账';
    setTimeout(() => { btn.textContent = '立即充值'; btn.disabled = false; }, 1500);
    toast(first
      ? '💳 恭喜脱离穷鬼行列！到账 ' + pk.coin + ' 🪙，永久富豪会员 👑（全场 8 折）'
      : '💳 到账 ' + pk.coin + ' 🪙，富豪身份再次确认 💸');
  }, 500);
}
document.getElementById('shop-close').addEventListener('click', closeShop);
document.getElementById('shop-modal').addEventListener('click', e => { if (e.target.id === 'shop-modal') closeShop(); });
document.querySelectorAll('#shop-modal .tab').forEach(b => b.addEventListener('click', () => openTab(b.dataset.tab)));
document.getElementById('broke-recharge').addEventListener('click', () => { hideBroke(); openShop('coin'); });
document.getElementById('broke-buy').addEventListener('click', () => { hideBroke(); openShop('buy'); });
document.getElementById('broke-quit').addEventListener('click', endGame);

// 首屏
document.getElementById('overlay').classList.add('show');
updateHUD();
updateWallet();
</script>
</body>
</html>
